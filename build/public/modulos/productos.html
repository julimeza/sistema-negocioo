<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Gestión de Productos</title>

    <link rel="stylesheet" href="../css/bootstrap.min.css" />
    <link rel="stylesheet" href="../css/bootstrap-icons/bootstrap-icons.css" />
    <link rel="stylesheet" href="../css/select2.min.css" />

    <style>
      .titulo-sin-linea::after {
        display: none !important;
      }

      .buscador-productos {
        position: relative;
        width: 320px;
      }

      .buscador-productos i {
        position: absolute;
        top: 50%;
        left: 14px;
        transform: translateY(-50%);
        color: var(--azul-500);
        font-size: 1.1rem;
        pointer-events: none;
      }

      .buscador-productos input {
        padding-left: 40px !important;
        height: 44px !important;
        border-radius: 14px !important;
        border: 1px solid #ccd7ee !important;
        background: #f9fbff !important;
        font-weight: 500;
      }

      .buscador-productos input:focus {
        border-color: var(--azul-700) !important;
        box-shadow: 0 0 0 3px rgba(35, 76, 136, 0.25) !important;
      }

      .container {
        display: none;
      }

      :root {
        --azul-900: #1e2a44;
        --azul-700: #234c88;
        --azul-500: #3e5f9b;
        --azul-300: #d7e4ff;
        --bg-suave: #f4f7ff;
        --bg-panel: #ffffff;
        --radius: 20px;
        --radius-lg: 26px;
        --shadow: 0 12px 30px rgba(0, 0, 0, 0.12);
        --shadow-soft: 0 6px 16px rgba(0, 0, 0, 0.08);
      }

      body {
        background: var(--bg-suave);
      }

      .btn-accion {
        padding: 6px 10px !important;
        font-size: 0.85rem !important;
        border-radius: 10px !important;
        line-height: 1 !important;
      }

      .btn-accion i {
        font-size: 1rem;
      }

      .acciones-btns {
        display: flex;
        gap: 6px;
        justify-content: center;
        flex-wrap: wrap;
      }

      @media (max-width: 1366px) {
        .btn-accion {
          padding: 5px 8px !important;
          font-size: 0.8rem !important;
        }

        .btn-accion i {
          font-size: 0.95rem;
        }
      }

      @media (max-width: 1100px) {
        .acciones-btns {
          flex-direction: column;
          gap: 4px;
        }
      }

      .header-productos {
        background: linear-gradient(135deg, #ffffffcc, #f7faffee);
        border-radius: 22px;
        padding: 26px 30px;
        box-shadow: var(--shadow);
        display: flex;
        align-items: center;
        justify-content: space-between;
      }

      .header-left {
        display: flex;
        align-items: center;
        gap: 18px;
      }

      .header-left i {
        font-size: 2.2rem;
        color: var(--azul-700);
      }

      .header-left h2 {
        margin: 0;
        font-weight: 900;
        letter-spacing: 0.5px;
        color: var(--azul-900);
      }

      .btn-volver {
        background: #e2e8f0 !important;
        color: #334155 !important;
        border-radius: 12px;
        font-weight: 600;
        padding: 9px 22px;
        transition: 0.25s;
      }

      .btn-volver:hover {
        background: #cdd5df !important;
      }

      .card {
        background: var(--bg-panel);
        border-radius: var(--radius-lg);
        border: 1px solid rgba(255, 255, 255, 0.7);
        box-shadow: var(--shadow-soft);
        padding: 26px !important;
        position: relative;
        overflow: hidden;
      }

      .form-control,
      .form-select {
        height: 46px !important;
        border-radius: 14px !important;
        border: 1px solid #ccd7ee !important;
        background: #f9fbff !important;
        font-size: 15px;
      }

      .form-control:focus,
      .form-select:focus {
        border-color: var(--azul-700) !important;
        box-shadow: 0 0 0 3px rgba(35, 76, 136, 0.25) !important;
      }

      .form-label {
        color: var(--azul-500);
        font-weight: 600;
      }

      .btn-guardar {
        background: var(--azul-700) !important;
        border-radius: 50px;
        padding: 10px 32px;
        color: white !important;
        font-weight: 700;
      }

      .filter-buttons {
        background: #ffffff;
        padding: 14px;
        border-radius: 16px;
        box-shadow: var(--shadow-soft);
      }

      .filter-buttons button {
        border: none;
        border-radius: 40px;
        padding: 10px 26px;
        font-weight: 700;
        background: #e7eefc;
        color: var(--azul-700);
        font-size: 15px;
      }

      .filter-buttons .active {
        background: var(--azul-700);
        color: white;
      }

      .fade-section {
        display: none;
        opacity: 0;
      }

      .fade-section.active {
        display: block;
        opacity: 1;
      }

      .table {
        border-radius: 0 !important;
        box-shadow: none !important;
        border: 1px solid #dbe3f8 !important;
      }

      .table thead {
        background: var(--azul-700) !important;
        color: white;
      }

      .section-sueltos {
        background: #fff7e1;
        border: 1px solid #ffe299;
        border-radius: var(--radius-lg);
      }

      .section-cigarros {
        background: #ffe5e5;
        border: 1px solid #ffbaba;
        border-radius: var(--radius-lg);
      }

      #alertaSinStock {
        display: none;
        position: fixed;
        top: 15px;
        left: 50%;
        transform: translateX(-50%);
        z-index: 9999;
        width: 90%;
        max-width: 450px;
        background: #dc2626;
        color: white;
        padding: 14px 26px;
        border-radius: 14px;
        font-weight: 700;
      }
    </style>
  </head>

  <body>
    <div class="container py-4">
      <div class="d-flex justify-content-between align-items-center mb-4">
        <h2 class="titulo-principal-productos">
          <i class="bi bi-shop-window"></i> Gestión de Productos
        </h2>
        <a href="/index.html" class="btn btn-volver">
          <i class="bi bi-arrow-left-circle"></i> Volver
        </a>
      </div>

      <div id="alertaSinStock">
        ⚠️ Algunos productos tienen poco stock
        <button type="button" class="btn-close" onclick="cerrarAlerta()"></button>
      </div>

      <div class="filter-buttons mb-4 text-center">
        <button class="active" data-target="generales">Generales</button>
        <button data-target="sueltos">Sueltos</button>
        <button data-target="cigarros">Cigarros</button>
      </div>

      <div id="form-generales" class="fade-section active">
        <div class="card mb-4">
          <h4 class="titulo-seccion">Productos generales</h4>
          <form id="formGeneral" class="row g-2 align-items-end">
            <div class="col-md-3">
              <label class="form-label">Nombre</label>
              <input id="nombreGeneral" type="text" class="form-control" />
            </div>
            <div class="col-md-2">
              <label class="form-label">Código</label>
              <input id="codigoGeneral" type="text" class="form-control" />
            </div>
            <div class="col-md-2">
              <label class="form-label">Stock</label>
              <input id="stockGeneral" type="number" class="form-control" />
            </div>
            <div class="col-md-2">
              <label class="form-label">Costo</label>
              <input id="costoGeneral" type="number" class="form-control" />
            </div>
            <div class="col-md-2">
              <label class="form-label">Venta</label>
              <input id="ventaGeneral" type="number" class="form-control" />
            </div>
            <div class="col-12 text-end mt-3">
              <button type="submit" class="btn btn-guardar">Guardar</button>
            </div>
          </form>
        </div>
      </div>
    </div>

    <script src="../js/jquery.min.js"></script>
    <script src="../js/select2.min.js"></script>
    <script src="../js/bootstrap.bundle.min.js"></script>
    <script src="../js/productos.js"></script>

    <script>
      document.querySelectorAll(".filter-buttons button").forEach((btn) => {
        btn.addEventListener("click", () => {
          document
            .querySelectorAll(".filter-buttons button")
            .forEach((b) => b.classList.remove("active"));
          btn.classList.add("active");
          const target = btn.dataset.target;
          document.querySelectorAll(".fade-section").forEach((sec) => {
            sec.classList.remove("active");
            if (sec.id === "form-" + target) sec.classList.add("active");
          });
        });
      });
    </script>
  </body>
</html>
