<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Módulo de Ventas</title>

    <link rel="stylesheet" href="../css/bootstrap-icons/bootstrap-icons.css">
    <link rel="stylesheet" href="../css/bootstrap.min.css">
    <link rel="stylesheet" href="../css/select2.min.css">

    <style>
      body,
      h1,
      h2,
      h3,
      h4,
      h5,
      h6,
      button,
      .form-control,
      .form-select,
      label {
        font-family: "Poppins", sans-serif !important;
        letter-spacing: 0.2px;
      }

      h2,
      .modal-title {
        font-weight: 400;
        font-size: 1.65rem;
        color: #234c88;
        letter-spacing: 0.5px;
      }

      .titulo-seccion {
        font-weight: 600 !important;
        font-size: 1.15rem !important;
        color: #234c88 !important;
        border-bottom-width: 3px;
        letter-spacing: 0.4px;
      }

      .modal-body,
      .modal-login-body,
      .modal-content p {
        font-weight: 500;
        color: #444;
        font-size: 0.95rem;
      }

      .monto,
      #subtotalCarrito,
      #totalVendido,
      #totalGanancia,
      .cierre-valor,
      .ganancia,
      .total {
        font-family: "Poppins", sans-serif !important;
        font-weight: 700 !important;
        letter-spacing: 0.4px;
        font-size: 1.22rem !important;
        color: #1b3a6b !important;
      }

      .text-success,
      .ganancia {
        color: #0a9b39 !important;
        font-weight: 800 !important;
      }

      .cierre-valor {
        font-size: 1.45rem !important;
        font-weight: 800 !important;
      }

      .total-label {
        font-weight: 600;
        font-size: 0.98rem;
        color: #346ccf;
        letter-spacing: 0.3px;
      }

      :root {
        --primary: #234c88;
        --primary-soft: #cfe2ff;
        --primary-light: #e7f1ff;
        --accent: #68a8ff;
        --success: #15b374;
        --danger: #e54848;
        --gray: #6c7a91;
        --white: #ffffff;
      }

      body {
        background: var(--primary-light);
        font-family: "Inter", sans-serif;
      }

      .card {
        border-radius: 18px !important;
        border: 1px solid #d4e4ff;
        background: var(--white);
      }

      .form-label {
        font-weight: 700;
        color: var(--primary);
        font-size: 14px;
      }

      .form-control,
      .form-select {
        height: 44px !important;
        border-radius: 10px !important;
        border: 1px solid #b5c8e4 !important;
        background: #fff;
        color: #28415d;
        font-size: 15px;
        transition: 0.2s;
      }

      .form-control:focus,
      .form-select:focus {
        border-color: var(--accent) !important;
        box-shadow: 0 0 0 3px rgba(104, 168, 255, 0.35) !important;
      }

      .select2-container--default .select2-selection--single {
        height: 44px !important;
        display: flex !important;
        align-items: center !important;
        border-radius: 10px !important;
        border: 1px solid #b5c8e4 !important;
        padding-left: 10px !important;
        font-size: 15px;
      }

      .btn-success,
      #btnAgregarCarrito {
        background: var(--success) !important;
        border: none;
        border-radius: 10px !important;
        font-weight: 700;
        transition: 0.2s;
      }

      #btnVaciarCarrito {
        border-radius: 10px !important;
        border: 2px solid var(--danger) !important;
        color: var(--danger) !important;
        font-weight: 700;
      }

      .table {
        border-radius: 12px;
        overflow: hidden;
        border: 1px solid #cddfff;
        font-size: 0.95rem;
        background: white;
      }

      .table thead {
        background: var(--primary-soft) !important;
        color: var(--primary) !important;
        font-weight: 800 !important;
        font-size: 0.9rem;
      }

      #modalCierreCaja .modal-content {
        border-radius: 22px !important;
        border: 2px solid #cddfff !important;
        padding: 25px 28px !important;
        background: #ffffff;
      }

      .btn-caja-option {
        display: flex;
        align-items: center;
        gap: 14px;
        padding: 14px 18px;
        border-radius: 18px !important;
        background: #f8fbff;
        border: 1px solid #d9e7ff !important;
        font-weight: 700;
        font-size: 16px;
        color: #113c6b;
      }
    </style>
  </head>

  <body>
    <input type="text" id="codigoScanner" style="opacity:0;position:absolute;pointer-events:none" />

    <div class="container py-4">
      <div class="d-flex justify-content-between align-items-center mb-4">
        <h2><i class="bi bi-cart-check"></i> Módulo de Ventas</h2>
        <a href="/index.html" class="btn btn-secondary rounded-pill px-4">
          <i class="bi bi-arrow-left-circle"></i> Volver
        </a>
      </div>

      <div class="card p-4 mb-4 shadow-sm">
        <h4 class="titulo-seccion">Registrar venta</h4>

        <form id="formVentaNormal" class="row g-2 align-items-end">
          <div class="col-md-3">
            <label class="form-label">Producto</label>
            <select id="productoSelect" class="form-select"></select>
          </div>

          <div class="col-md-2">
            <label class="form-label">Stock disponible</label>
            <input type="text" id="stockDisponible" class="form-control" readonly />
          </div>

          <div class="col-md-2">
            <label class="form-label">Cantidad</label>
            <input type="number" id="cantidad" class="form-control" min="1" />
          </div>

          <div class="col-md-2">
            <label class="form-label">Forma de pago</label>
            <select id="formaPago" class="form-select">
              <option>Efectivo</option>
              <option>Transferencia</option>
              <option>Tarjeta Débito</option>
              <option>Tarjeta Crédito</option>
            </select>
          </div>

          <div class="col-md-2">
            <label class="form-label">Total ($)</label>
            <input type="text" id="total" class="form-control" readonly />
          </div>

          <div class="col-md-1 text-end">
            <button class="btn btn-success rounded-pill w-100">
              <i class="bi bi-check-circle"></i>
            </button>
          </div>
        </form>

        <div class="mt-4">
          <div class="d-flex justify-content-between align-items-center mb-2">
            <h5 class="text-secondary mb-0">Carrito</h5>

            <div class="d-flex gap-2">
              <button class="btn btn-primary rounded-pill" id="btnAgregarCarrito">
                <i class="bi bi-plus-circle"></i> Agregar al carrito
              </button>

              <button class="btn btn-outline-danger rounded-pill" id="btnVaciarCarrito">
                <i class="bi bi-trash"></i> Vaciar carrito
              </button>
            </div>
          </div>

          <div class="table-responsive">
            <table class="table table-bordered table-striped text-center align-middle">
              <thead>
                <tr>
                  <th>Producto</th>
                  <th>Cantidad</th>
                  <th>Precio unitario</th>
                  <th>Total</th>
                  <th>Accion</th>
                  <th>Accion</th>
                </tr>
              </thead>
              <tbody id="tablaCarrito"></tbody>
            </table>
          </div>

          <h6 class="text-end mt-2 total-label">
            Subtotal carrito: <span id="subtotalCarrito" class="monto">$0.00</span>
          </h6>
        </div>
      </div>

      <div class="card p-4 shadow-sm">
        <h4 class="titulo-seccion">Ventas del día</h4>

        <div class="table-responsive">
          <table class="table table-bordered table-striped text-center align-middle">
            <thead>
              <tr>
                <th>Fecha</th>
                <th>Producto</th>
                <th>Tipo</th>
                <th>Cantidad</th>
                <th>Forma de pago</th>
                <th>Total</th>
                <th>Ganancia</th>
              </tr>
            </thead>
            <tbody id="tablaVentas"></tbody>
          </table>
        </div>

        <div class="text-end mt-3">
          <p class="total-label">Total vendido: <span id="totalVendido">$0.00</span></p>
          <p class="total-label">Ganancia total: <span id="totalGanancia">$0.00</span></p>
        </div>
      </div>
    </div>

    <script src="../js/jquery.min.js"></script>
    <script src="../js/select2.min.js"></script>
    <script src="../js/bootstrap.bundle.min.js"></script>
    <script src="../js/ventas.js"></script>
    <script>
      document.addEventListener("shown.bs.modal", () => {
        document.documentElement.classList.add("modal-open");
        document.body.classList.add("modal-open");
      });

      document.addEventListener("hidden.bs.modal", () => {
        document.documentElement.classList.remove("modal-open");
        document.body.classList.remove("modal-open");
      });

      document.addEventListener("shown.bs.modal", () => {
        document.body.style.overflowY = "hidden";
      });

      document.addEventListener("hidden.bs.modal", () => {
        document.body.style.overflowY = "auto";
      });
    </script>
  </body>
</html>
