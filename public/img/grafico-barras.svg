<svg width="900" height="300" viewBox="0 0 900 300" xmlns="http://www.w3.org/2000/svg">

  <defs>
    <!-- degradado para barras -->
    <linearGradient id="bars" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#3A8DFF"/>
      <stop offset="100%" stop-color="#9BC7FF"/>
    </linearGradient>
  </defs>

  <!-- barras -->
  <rect x="70"  y="180" width="50" height="100" fill="url(#bars)" rx="6"/>
  <rect x="160" y="150" width="50" height="130" fill="url(#bars)" rx="6"/>
  <rect x="250" y="130" width="50" height="150" fill="url(#bars)" rx="6"/>
  <rect x="340" y="120" width="50" height="160" fill="url(#bars)" rx="6"/>
  <rect x="430" y="110" width="50" height="170" fill="url(#bars)" rx="6"/>
  <rect x="520" y="90"  width="50" height="190" fill="url(#bars)" rx="6"/>
  <rect x="610" y="60"  width="50" height="220" fill="url(#bars)" rx="6"/>
  <rect x="700" y="30"  width="50" height="250" fill="url(#bars)" rx="6"/>

  <!-- línea ascendente -->
  <polyline 
    points="95,220 185,185 275,165 365,155 455,145 545,120 635,95 725,50" 
    stroke="#1B5FCC" stroke-width="6" fill="none" stroke-linecap="round"/>

  <!-- puntos -->
  <g fill="#1B5FCC">
    <circle cx="95" cy="220" r="8"/>
    <circle cx="185" cy="185" r="8"/>
    <circle cx="275" cy="165" r="8"/>
    <circle cx="365" cy="155" r="8"/>
    <circle cx="455" cy="145" r="8"/>
    <circle cx="545" cy="120" r="8"/>
    <circle cx="635" cy="95"  r="8"/>
    <circle cx="725" cy="50"  r="8"/>
  </g>

  <!-- flecha final -->
  <line x1="725" y1="50" x2="760" y2="10" stroke="#1B5FCC" stroke-width="7" stroke-linecap="round"/>
  <polygon points="760,10 745,18 770,25" fill="#1B5FCC"/>

</svg>
