<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Sistema Drugstore</title>

    <!-- Bootstrap núcleo -->
    <link rel="stylesheet" href="css/bootstrap.min.css" />

    <!-- Bootstrap Icons para iconitos pro -->
<link rel="stylesheet" href="/css/bootstrap-icons/bootstrap-icons.css">


    <!-- Tus estilos -->
    <link rel="stylesheet" href="css/estilos.css" />
  </head>

  <body class="layout-nuevo">
    <!-- ENCABEZADO MODERNO -->
    <header class="encabezado">
      <div class="encabezado-inner">
        <h1>SISTEMA DRUGSTORE</h1>
        <p class="encabezado-sub">Panel Principal</p>
      </div>
    </header>

    <!-- CONTENIDO CENTRAL -->
    <main class="panel-central">
      <!-- LOGO -->
      <div class="logo-wrapper">
        <img src="img/logo.png" class="logo-circulo" alt="Logo del sistema" />
      </div>

      <!-- TEXTO INTRO -->
      <p class="descripcion">
        Seleccioná el <span>módulo</span> al que querés ingresar para empezar a
        trabajar.
      </p>

      <!-- MENÚ DE MÓDULOS -->
      <div class="menu-modulos">
        <!-- MÓDULO STOCK -->
        <a href="modulos/productos.html" class="item-modulo m1">
          <div class="item-icon">
            <i class="bi bi-box-seam"></i>
          </div>
          <div class="item-text">
            <div class="item-titulo">Carga de Stock</div>
            <div class="item-subtitulo">Carga y control de productos</div>
          </div>
        </a>

        <!-- MÓDULO VENTAS -->
        <a href="modulos/ventas.html" class="item-modulo m2">
          <div class="item-icon">
            <i class="bi bi-cart-check"></i>
          </div>
          <div class="item-text">
            <div class="item-titulo">Venta de Productos</div>
            <div class="item-subtitulo">Ventas diarias y cierre de caja</div>
          </div>
        </a>
      </div>
    </main>
  </body>
</html>
